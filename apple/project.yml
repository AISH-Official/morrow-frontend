name: Morrow
options:
  bundleIdPrefix: com.qlsl1198
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4UTM2VZ53U
targets:
  Morrow:
    type: application
    platform: iOS
    sources:
      - path: ../ios/Sources
      - path: Morrow/Resources
    resources:
      - path: Morrow/Assets.xcassets
    info:
      path: Morrow/Info.plist
    entitlements:
      path: Morrow/Morrow.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qlsl1198.morrowwellness
        PRODUCT_NAME: Morrow
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
    dependencies:
      - target: MorrowWatch
        embed: true
  MorrowWatch:
    type: application
    platform: watchOS
    sources:
      - path: ../watch/Sources
      - path: MorrowWatch/Resources
    resources:
      - path: MorrowWatch/Assets.xcassets
    info:
      path: MorrowWatch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qlsl1198.morrowwellness.watchkitapp
        PRODUCT_NAME: Morrow Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
schemes:
  Morrow:
    build:
      targets:
        Morrow: all
        MorrowWatch: all
    run:
      config: Debug
    archive:
      config: Release
